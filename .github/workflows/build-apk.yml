name: Build eX Money Book V2.4 Search APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug
      - name: Rename APK
        run: |
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk apk-output/eX_MoneyBook_V2_4_SEARCH.apk
      - uses: actions/upload-artifact@v4
        with:
          name: eX-MoneyBook-V2-4-SEARCH-APK
          path: apk-output/eX_MoneyBook_V2_4_SEARCH.apk
